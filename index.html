
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>Контакты для записи</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:28px 16px;
 display:grid;place-items:center;
 background:#101114;color:#f5f5f7;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
main{width:100%;max-width:430px}
h1{font-size:28px;letter-spacing:-.8px;margin:0 0 8px}
.subtitle{color:#999ba6;margin:0 0 26px;line-height:1.5}
.contact{
 background:#191a1f;border:1px solid #2b2c33;
 border-radius:20px;padding:22px;margin-bottom:16px
}
.contact h2{font-size:16px;margin:0 0 12px;color:#a8a9b2;font-weight:500}
.number{font-size:23px;font-weight:650;letter-spacing:-.5px;margin-bottom:10px}
.services{font-size:13px;color:#92949f;margin-bottom:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
a,button{
 display:flex;justify-content:center;align-items:center;
 min-height:45px;padding:11px 8px;border-radius:11px;
 border:1px solid #373841;background:#25262d;color:#fff;
 text-decoration:none;font-size:14px;font-weight:600;
 cursor:pointer;font-family:inherit
}
a:hover,button:hover{background:#34353e}
.primary{background:#fff;color:#111;border-color:#fff}
.primary:hover{background:#dedee3;color:#111}
.status{min-height:20px;text-align:center;color:#9de6b1;font-size:13px;margin-top:12px}
footer{text-align:center;color:#777983;font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>Запись и консультации</h1>
<p class="subtitle">Выберите удобный способ связи.</p>

<section class="contact">
<h2>Контакт № 1</h2>
<div class="number">+380 50 609 5908</div>
<div class="services">WhatsApp · Telegram</div>
<div class="actions">
<button class="primary" onclick="copy('+380506095908')">Скопировать номер</button>
<a href="tel:+380506095908">Позвонить</a>
<a href="https://wa.me/380506095908" target="_blank" rel="noopener">WhatsApp</a>
<a href="https://t.me/+380506095908" target="_blank" rel="noopener">Telegram</a>
</div>
</section>

<section class="contact">
<h2>Контакт № 2</h2>
<div class="number">+40 734 393 146</div>
<div class="services">Телефон · WhatsApp · Telegram · Viber</div>
<div class="actions">
<button class="primary" onclick="copy('+40734393146')">Скопировать номер</button>
<a href="tel:+40734393146">Позвонить</a>
<a href="https://wa.me/40734393146" target="_blank" rel="noopener">WhatsApp</a>
<a href="https://t.me/+40734393146" target="_blank" rel="noopener">Telegram</a>
<a href="viber://chat?number=%2B40734393146">Viber</a>
</div>
</section>

<div class="status" id="status" aria-live="polite"></div>
<footer>Контакты для записи и консультаций</footer>
</main>

<script>
async function copy(value){
 const status=document.getElementById('status');
 try{
  await navigator.clipboard.writeText(value);
  status.textContent='Номер скопирован';
 }catch(e){
  const input=document.createElement('textarea');
  input.value=value;
  input.style.position='fixed';
  input.style.opacity='0';
  document.body.appendChild(input);
  input.select();
  const ok=document.execCommand('copy');
  input.remove();
  status.textContent=ok?'Номер скопирован':'Не удалось скопировать номер';
 }
}
</script>
</body>
</html>
